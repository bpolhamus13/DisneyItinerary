<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120f3d">
<meta name="description" content="Our family's day-by-day Orlando trip playbook, October 17–23, 2026.">
<title>Orlando Trip Playbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%233b1d8f'/%3E%3Cpath d='M32 10l5.5 15.5L53 32l-15.5 6.5L32 54l-5.5-15.5L11 32l15.5-6.5z' fill='%23fcd34d'/%3E%3C/svg%3E">
<style>
:root{
  --navy:#120f3d; --royal:#2340b8; --blue:#3b6cf6; --purple:#5b2bd1; --violet:#8b5cf6; --pink:#ec6fd8; --gold:#fcd34d;
  --bg:#f2f0fb; --surface:#ffffff; --surface-2:#f7f5ff; --ink:#1b1745; --muted:#5d5985; --line:#e3def4;
  --exact-bg:#fff1c2; --exact-ink:#7a4a00; --target-bg:#dde7ff; --target-ink:#1d3aa8; --flex-bg:#d8f5ec; --flex-ink:#0b6b4f;
  --accent:#5b2bd1; --accent-soft:#ece6ff;
  --shadow:0 1px 2px rgba(27,23,69,.06),0 6px 20px rgba(59,29,143,.08);
  --display:"Fredoka",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c0a24; --surface:#18153b; --surface-2:#1e1a48; --ink:#f1eeff; --muted:#b3add8; --line:#2d2862;
    --exact-bg:#4a3608; --exact-ink:#ffe08a; --target-bg:#1d2d6b; --target-ink:#bcd0ff; --flex-bg:#0f4536; --flex-ink:#9ff0d3;
    --accent:#b69bff; --accent-soft:#2b2463;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0c0a24; --surface:#18153b; --surface-2:#1e1a48; --ink:#f1eeff; --muted:#b3add8; --line:#2d2862;
  --exact-bg:#4a3608; --exact-ink:#ffe08a; --target-bg:#1d2d6b; --target-ink:#bcd0ff; --flex-bg:#0f4536; --flex-ink:#9ff0d3;
  --accent:#b69bff; --accent-soft:#2b2463;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}

/* ---------- Sticky day strip ---------- */
.daybar{position:sticky;top:0;z-index:20;background:rgba(18,15,61,.92);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);padding-top:env(safe-area-inset-top);box-shadow:0 2px 14px rgba(10,6,40,.25)}
.days{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none;scroll-snap-type:x proximity;max-width:860px;margin:0 auto}
.days::-webkit-scrollbar{display:none}
.day{flex:none;scroll-snap-align:center;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#e9e5ff;border-radius:14px;padding:7px 12px 8px;min-width:78px;min-height:52px;text-align:left;cursor:pointer;transition:background .2s,transform .2s,border-color .2s;position:relative}
.day:active{transform:scale(.97)}
.day b{display:block;font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#fff}
.day span{display:block;font-size:12px;opacity:.82;white-space:nowrap}
.day.active{background:linear-gradient(135deg,#4f7bff,#8b5cf6 60%,#d16be8);border-color:transparent;box-shadow:0 4px 14px rgba(139,92,246,.45)}
.day.active span{opacity:1}
.day .today-dot{position:absolute;top:6px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}

/* ---------- Hero banner ---------- */
.hero{position:relative;height:270px;overflow:hidden;color:#fff;background:var(--navy)}
.hero-art{position:absolute;inset:0}
.hero-art svg{width:100%;height:100%;display:block}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,8,40,.05) 30%,rgba(12,8,40,.78) 100%);pointer-events:none}
.hero-inner{position:absolute;inset:auto 0 0 0;z-index:2;padding:0 0 18px}
.hero .kicker{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:4px 10px;border-radius:999px}
.hero h1{font-family:var(--display);font-weight:700;font-size:32px;line-height:1.05;margin:8px 0 4px;text-shadow:0 2px 16px rgba(0,0,0,.35);text-wrap:balance}
.hero p{margin:0;font-size:14px;opacity:.95;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.hero-art.swap{animation:fadeIn .5s ease}
.hero-inner.swap{animation:rise .45s ease}
@keyframes fadeIn{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.brand{position:absolute;top:14px;left:0;right:0;z-index:2}
.brand .wrap{display:flex;justify-content:space-between;align-items:center}
.brand small{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.02em;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.brand small i{font-style:normal;color:var(--gold)}
.theme-btn{border:1px solid rgba(255,255,255,.3);background:rgba(18,15,61,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer}
.theme-btn svg{width:20px;height:20px}

/* twinkles & motion inside banners */
.tw{animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
.drift{animation:drift 9s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(14px,-6px)}}
.burst{transform-box:fill-box;transform-origin:center;animation:burst 3.2s ease-out infinite}
@keyframes burst{0%{transform:scale(.3);opacity:0}15%{opacity:1}70%{opacity:.9}100%{transform:scale(1.08);opacity:0}}
.puff{animation:puff 4s ease-in-out infinite}
@keyframes puff{0%,100%{opacity:.85;transform:translateY(0)}50%{opacity:.5;transform:translateY(-6px)}}
@media (prefers-reduced-motion: reduce){.tw,.drift,.burst,.puff,.hero-art.swap,.hero-inner.swap{animation:none!important}.burst{opacity:1}}

/* ---------- Content ---------- */
main{padding-top:18px}
.section-title{font-family:var(--display);font-weight:600;font-size:20px;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.section-title .count{margin-left:auto;font-family:var(--body);font-size:13px;font-weight:700;color:var(--muted)}
.progress{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:-2px 0 6px}
.progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#4f7bff,#8b5cf6,#ec6fd8);transition:width .4s ease}

.next{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#2a3fc4,#6a2fd6 70%,#b148cf);color:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 8px 24px rgba(91,43,209,.3);margin-bottom:6px;text-decoration:none}
.next .spark{flex:none;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.next small{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.next strong{display:block;font-family:var(--display);font-weight:600;font-size:18px;line-height:1.2}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:13px 14px;box-shadow:var(--shadow)}
.tile .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;margin-bottom:8px}
.tile .ic svg{width:18px;height:18px}
.tile h3{margin:0 0 3px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.tile p{margin:0;font-size:14px;line-height:1.45}
.ic.c1{background:#e0e8ff;color:#2340b8}.ic.c2{background:#ffe6d6;color:#b34a10}.ic.c3{background:#efe6ff;color:#5b2bd1}.ic.c4{background:#ffe3f4;color:#b0237f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ic.c1{background:#22337a;color:#c7d5ff}:root:not([data-theme="light"]) .ic.c2{background:#5a2c12;color:#ffd2b5}:root:not([data-theme="light"]) .ic.c3{background:#3a2780;color:#dccdff}:root:not([data-theme="light"]) .ic.c4{background:#5b1c48;color:#ffc9ea}}
:root[data-theme="dark"] .ic.c1{background:#22337a;color:#c7d5ff}:root[data-theme="dark"] .ic.c2{background:#5a2c12;color:#ffd2b5}:root[data-theme="dark"] .ic.c3{background:#3a2780;color:#dccdff}:root[data-theme="dark"] .ic.c4{background:#5b1c48;color:#ffc9ea}

.know{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);margin-top:10px;overflow:hidden}
.know summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:800;display:flex;align-items:center;gap:10px;min-height:48px}
.know summary::-webkit-details-marker{display:none}
.know summary .chev{margin-left:auto;transition:transform .2s;color:var(--muted)}
.know[open] summary .chev{transform:rotate(180deg)}
.know .body{padding:0 16px 14px;border-top:1px solid var(--line)}
.know dl{margin:0}
.know dt{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-top:12px}
.know dd{margin:2px 0 0;font-size:14px}

.search{display:flex;gap:8px;margin:4px 0 14px}
.search label{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px;min-height:46px;box-shadow:var(--shadow)}
.search label:focus-within{border-color:var(--violet);box-shadow:0 0 0 3px rgba(139,92,246,.2)}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;outline:none;padding:10px 0}
.search button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:0 14px;min-height:46px;cursor:pointer;font-weight:700;color:var(--muted)}

/* timeline */
.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:7px;top:10px;bottom:10px;width:2px;border-radius:2px;background:linear-gradient(#4f7bff,#8b5cf6,#ec6fd8)}
.event{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 14px 10px;margin:0 0 12px;box-shadow:var(--shadow);transition:opacity .25s,border-color .25s}
.event::before{content:"";position:absolute;left:-21px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--violet)}
.event.t-EXACT::before{border-color:#e0a400}
.event.t-FLEX::before{border-color:#16a37a}
.event.done{opacity:.55}
.event.done::before{background:var(--violet);border-color:var(--violet)}
.event.is-next{border-color:var(--violet);box-shadow:0 0 0 3px rgba(139,92,246,.22),var(--shadow)}
.event.is-next::before{background:var(--gold);border-color:#e0a400;box-shadow:0 0 0 5px rgba(252,211,77,.35)}
.ev-head{display:flex;gap:12px;align-items:flex-start}
.ev-main{flex:1;min-width:0}
.ev-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.time{font-family:var(--display);font-weight:600;font-size:17px;color:var(--accent);letter-spacing:.01em}
.badge{font-size:10.5px;font-weight:800;letter-spacing:.08em;padding:3px 8px;border-radius:999px}
.badge.EXACT{background:var(--exact-bg);color:var(--exact-ink)}
.badge.TARGET{background:var(--target-bg);color:var(--target-ink)}
.badge.FLEX{background:var(--flex-bg);color:var(--flex-ink)}
.badge.NEXT{background:linear-gradient(90deg,#fcd34d,#f9a8d4);color:#3b1060}
.event h3{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.2;margin:4px 0 4px}
.event p{margin:0;font-size:14.5px;color:var(--muted)}
.check{appearance:none;-webkit-appearance:none;flex:none;width:30px;height:30px;margin:0;border-radius:50%;border:2px solid var(--line);background:var(--surface-2);cursor:pointer;display:grid;place-items:center;transition:all .2s}
.check:checked{background:linear-gradient(135deg,#4f7bff,#8b5cf6);border-color:transparent}
.check:checked::after{content:"";width:9px;height:15px;border:solid #fff;border-width:0 3px 3px 0;transform:translateY(-2px) rotate(45deg)}
.check:focus-visible{outline:3px solid rgba(139,92,246,.45);outline-offset:2px}
.ev-details{margin-top:8px;border-top:1px dashed var(--line)}
.ev-details summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--accent);padding:10px 0 4px;min-height:40px}
.ev-details summary::-webkit-details-marker{display:none}
.ev-details summary svg{transition:transform .2s}
.ev-details[open] summary svg{transform:rotate(180deg)}
.ev-details .row{display:flex;gap:10px;padding:8px 0 6px}
.ev-details .row .dot{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center}
.ev-details .row .dot svg{width:16px;height:16px}
.ev-details .row b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.ev-details .row span{font-size:14px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}

/* guide */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{font-family:var(--display);font-weight:600;font-size:20px;margin:0 0 10px;display:flex;align-items:center;gap:10px}
.card h2 .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center}
.card h2 .ic svg{width:18px;height:18px}
.card ul{margin:0;padding:0;list-style:none}
.card li{padding:8px 0;border-top:1px solid var(--line);font-size:14.5px}
.card li:first-child{border-top:0}
.rules{counter-reset:r}
.rules li{display:flex;gap:12px;align-items:flex-start;font-weight:600;font-size:15px}
.rules li::before{counter-increment:r;content:counter(r);flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#fff;background:linear-gradient(135deg,#4f7bff,#8b5cf6 60%,#ec6fd8)}
.ll-day{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{font-size:13px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:4px 9px}
.chip b{font-weight:800}
.stars li{display:flex;gap:10px;align-items:flex-start}
.stars li svg{flex:none;width:20px;height:20px;color:#e0a400;margin-top:2px}
.legend li{display:flex;gap:12px;align-items:flex-start}
.legend .badge{flex:none;margin-top:2px;min-width:64px;text-align:center}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:4px 0 8px}
.person{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-weight:700;font-size:14px}
.person small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.note{font-size:14px;color:var(--muted);margin:8px 0 0}
/* ride buddies */
.rider{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-weight:700;font-size:14px;cursor:pointer;min-height:48px}
.rider .check{width:26px;height:26px}
.rider .check:checked::after{width:7px;height:13px}
.rider.off{color:var(--muted)}
.card h2 .links{margin-left:auto;display:flex;gap:6px}
.card h2 .links button,.seat-row select{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:6px 10px;font:700 13px var(--body);cursor:pointer}
.seat-row{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.seat-row select{font-size:16px;min-height:44px;padding:0 12px;margin-left:auto}
.shuffle-btn{width:100%;border:0;border-radius:16px;min-height:56px;margin:4px 0 14px;background:linear-gradient(135deg,#4f7bff,#8b5cf6);color:#fff;font:600 20px var(--display);display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;box-shadow:var(--shadow)}
.shuffle-btn svg{width:22px;height:22px}
.shuffle-btn:active{transform:scale(.98)}
.groups{display:grid;gap:10px}
.group{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);animation:pop .35s ease both}
.group .num{flex:none;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font:700 16px var(--display);background:var(--accent-soft);color:var(--accent)}
.group .names{display:flex;flex-wrap:wrap;gap:6px}
.group .names span{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-weight:700;font-size:15px}
.ride-msg{background:var(--exact-bg);color:var(--exact-ink);border-radius:14px;padding:12px 14px;font-weight:700;font-size:14.5px}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* bottom nav */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
.tabbar .inner{max-width:520px;margin:0 auto;display:flex;gap:6px}
.tabbar button{flex:1;border:0;background:transparent;border-radius:14px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:800;color:var(--muted);cursor:pointer}
.tabbar button svg{width:22px;height:22px}
.tabbar button.active{background:var(--accent-soft);color:var(--accent)}
.tabbar button[hidden]{display:none}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px 0 6px}

@media (min-width:700px){
  .hero{height:300px}
  .hero h1{font-size:44px}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .days{justify-content:center}
}
</style>
</head>
<body>

<div class="daybar"><nav class="days" id="days" aria-label="Trip days"></nav></div>

<header class="hero" id="hero">
  <div class="hero-art" id="heroArt" aria-hidden="true"></div>
  <div class="brand"><div class="wrap"><small><i>✦</i> Orlando Trip Playbook</small>
    <button class="theme-btn" id="themeBtn" aria-label="Toggle dark mode"></button></div></div>
  <div class="hero-inner" id="heroInner"></div>
</header>

<main class="wrap" id="content"></main>

<footer class="wrap">Confirm park hours, showtimes and ride availability in the official apps each morning. ✦ Have a magical trip!</footer>

<div class="tabbar"><div class="inner">
  <button id="tab-it" class="active" onclick="setTab('it')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>Itinerary</button>

function rnd(seed){ let s = seed; return () => (s = (s * 9301 + 49297) % 233280) / 233280; }
function stars(n, seed, maxY, color='#fff'){
  const r = rnd(seed); let out = '';
  for (let i=0;i<n;i++){ const x=(r()*800).toFixed(1), y=(r()*maxY).toFixed(1), s=(r()*1.6+.5).toFixed(2);
    out += `<circle class="tw" cx="${x}" cy="${y}" r="${s}" fill="${color}" style="animation-delay:${(r()*3).toFixed(2)}s"/>`; }
  return out;
}
function sparkle(x,y,s,c='#fde68a',d=0){ return `<path class="tw" style="animation-delay:${d}s" transform="translate(${x} ${y}) scale(${s})" d="M0-10 2.4-2.4 10 0 2.4 2.4 0 10-2.4 2.4-10 0-2.4-2.4z" fill="${c}"/>`; }
function firework(x,y,r,c,d){
  let rays=''; for(let i=0;i<14;i++){ const a=i/14*Math.PI*2; rays+=`<line x1="${(Math.cos(a)*r*.3).toFixed(1)}" y1="${(Math.sin(a)*r*.3).toFixed(1)}" x2="${(Math.cos(a)*r).toFixed(1)}" y2="${(Math.sin(a)*r).toFixed(1)}"/><circle cx="${(Math.cos(a)*r*1.08).toFixed(1)}" cy="${(Math.sin(a)*r*1.08).toFixed(1)}" r="1.8" fill="${c}" stroke="none"/>`; }
  return `<g transform="translate(${x} ${y})"><g class="burst" style="animation-delay:${d}s" stroke="${c}" stroke-width="2" stroke-linecap="round">${rays}</g></g>`;
}

/* ---------- time parsing for "Up next" ---------- */
function rowMinutes(rows){
  let mer = null, prev = -1;
  return rows.map(r => {
    const m = r.time.match(/(\d{1,2}):(\d{2})/); if (!m) return null;
    const ex = r.time.match(/(AM|PM)/);
    if (ex) mer = ex[1];
    if (!mer) mer = 'AM';
    let h = +m[1] % 12; if (mer === 'PM') h += 12;
    let mins = h*60 + +m[2];
    if (mins < prev - 30) { mins += 720; mer = 'PM'; }
    prev = mins; return mins;
  });
}
data.forEach(d => d.mins = rowMinutes(d.rows));
function todayIndex(){
  const n = new Date();
  if (n.getFullYear() !== 2026 || n.getMonth() !== 9) return -1;
  const i = n.getDate() - 17; return (i >= 0 && i < data.length) ? i : -1;
}
function nextIndex(dayIdx){
  if (dayIdx !== todayIndex()) return -1;
  const n = new Date(), now = n.getHours()*60 + n.getMinutes();
  const mins = data[dayIdx].mins;
  // the next stop is the first row starting within the last 10 minutes or later
  for (let i=0;i<mins.length;i++) if (mins[i] != null && mins[i] >= now - 10) return i;
  return -1;
}

/* ---------- rendering ---------- */
function renderDays(){
  const ti = todayIndex();
  $('days').innerHTML = data.map((d,i) => `<button class="day ${tab==='it'&&selected===i?'active':''}" onclick="setDay(${i})" aria-pressed="${tab==='it'&&selected===i}">${i===ti?'<i class="today-dot" aria-label="Today"></i>':''}<b>${esc(d.date)}</b><span>${esc(d.short)}</span></button>`).join('');
  $('tab-today').hidden = ti < 0;
  ['it','guide','ride'].forEach(t => $('tab-'+t).classList.toggle('active', tab===t));
  const act = $('days').querySelector('.active'); if (act) act.scrollIntoView({block:'nearest', inline:'center', behavior:'smooth'});
}
function renderHero(){
  const art = $('heroArt'), inner = $('heroInner');

    inner.innerHTML = `<div class="wrap"><span class="kicker">✦ Who rides with who</span><h1>Ride Buddies</h1><p>Tap shuffle to pick who rides together.</p></div>`;

    art.innerHTML = banners[7]();

    inner.innerHTML = `<div class="wrap"><span class="kicker">✦ ${esc(d.long)}</span><h1>${esc(d.name)}</h1><p>${esc(d.meta)}</p></div>`;
  }
  [art, inner].forEach(el => { el.classList.remove('swap'); void el.offsetWidth; el.classList.add('swap'); });
}
function renderContent(){
  const c = $('content');
  if (tab === 'guide'){ c.innerHTML = guideHTML(); return; }
  if (tab === 'ride'){ c.innerHTML = rideHTML(); return; }

  const count = d.rows.filter((r,i) => done[selected+'-'+i]).length;
  const next = ni >= 0 ? `<a class="next" href="#ev${ni}"><span class="spark">${icons.star}</span><span><small>Up next · ${esc(d.rows[ni].time)}</small><strong>${esc(d.rows[ni].title)}</strong></span></a>` : '';
  c.innerHTML = `${next}
    <div class="tiles">${d.summary.map(s => { const [ic,cl] = tileIcon(s.label); return `<div class="tile"><div class="ic ${cl}">${icons[ic]}</div><h3>${esc(s.label)}</h3><p>${esc(s.text)}</p></div>`; }).join('')}</div>
    <details class="know"><summary><span class="ic c3" style="width:30px;height:30px;border-radius:10px;display:grid;place-items:center">${icons.info.replace('<svg','<svg width="18" height="18"')}</span>Good to know today<span class="chev">${icons.chev}</span></summary>
      <div class="body"><dl>${d.notes.map(n => `<dt>${esc(n.label)}</dt><dd>${esc(n.text)}</dd>`).join('')}</dl></div></details>
    <h2 class="section-title">The plan <span class="count">${count} of ${d.rows.length} done</span></h2>
    <div class="progress" aria-hidden="true"><i style="width:${Math.round(count/d.rows.length*100)}%"></i></div>
    <div class="search"><label>${icons.search}<input id="search" type="search" aria-label="Search today's plan" placeholder="Search rides, meals, meetups…" value="${esc(query)}" oninput="search(this.value)"></label>${query?'<button onclick="clearSearch()">Clear</button>':''}</div>
    <div class="timeline" id="list">${listHTML()}</div>`;
}
function listHTML(){
  const d = data[selected], ni = nextIndex(selected), q = query.trim().toLowerCase();
  const items = d.rows.map((r,i) => ({r,i})).filter(({r}) => !q || [r.time,r.type,r.title,r.plan,r.parallel,r.behind].join(' ').toLowerCase().includes(q));
  if (!items.length) return '<p class="empty">No matching stops today.</p>';
  return items.map(({r,i}) => { const k = selected+'-'+i, isDone = !!done[k];
    return `<article class="event t-${esc(r.type)} ${isDone?'done':''} ${i===ni?'is-next':''}" id="ev${i}">
      <div class="ev-head"><div class="ev-main">
        <div class="ev-meta"><span class="time">${esc(r.time)}</span><span class="badge ${esc(r.type)}">${esc(r.type)}</span>${i===ni?'<span class="badge NEXT">UP NEXT</span>':''}</div>
        <h3>${esc(r.title)}</h3><p>${esc(r.plan)}</p></div>
        <input class="check" type="checkbox" aria-label="Mark ${esc(r.title)} done" ${isDone?'checked':''} onchange="toggle(${i})"></div>

        <div class="row"><span class="dot ic c4">${icons.clock}</span><div><b>If behind</b><span>${esc(r.behind)}</span></div></div>
      </details></article>`; }).join('');
}

  <section class="card"><h2><span class="ic c4">${icons.star}</span>Seven trip-defining moments</h2><ul class="stars">${g.moments.map(m=>`<li>${icons.star}<span>${esc(m)}</span></li>`).join('')}</ul><p class="note">Everything else is upside.</p></section>

  <section class="card"><h2><span class="ic c2">${icons.moon}</span>Meal &amp; night anchors</h2><ul>${g.anchors.map(a=>`<li><span class="ll-day">${esc(a[0])}</span>${esc(a[1])}</li>`).join('')}</ul></section>
  <section class="card"><h2><span class="ic c1">${icons.clock}</span>Time labels</h2><ul class="legend">
    <li><span class="badge EXACT">EXACT</span><span>Reservation, reunion, show, Lightning Lane window or must-leave time.</span></li>
    <li><span class="badge TARGET">TARGET</span><span>Preferred start time; adjust slightly without changing the day.</span></li>
    <li><span class="badge FLEX">FLEX</span><span>Optional or movable. Cut these first when the day slips.</span></li></ul></section>
  <section class="card"><h2><span class="ic c4">${icons.info}</span>Remember</h2><ul>${g.remember.map(r=>`<li>${esc(r)}</li>`).join('')}</ul></section>`;

/* ---------- ride buddies ---------- */
const roster = [...guide.core, ...guide.sara].map(p => p[0]);
const CHILD = 'June', PARENTS = ['Brandon', 'Sara'];   // permanent rule: June always rides with a parent
const SEAT_OPTIONS = [2, 3, 4, 5, 6, 8];
let riders = store.get('orlando-riders', roster).filter(n => roster.includes(n));
let seats = +store.get('orlando-seats', 2) || 2;
let rideResult = null;

function shuffled(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function makeGroups(people, perRow){
  if (people.length < 2) return { error: 'Pick at least 2 riders.' };
  const hasChild = people.includes(CHILD), parents = PARENTS.filter(p => people.includes(p));
  if (hasChild && !parents.length) return { error: `${CHILD} needs ${PARENTS.join(' or ')} — check one of them.` };
  // balanced row sizes, e.g. 9 riders / 4 seats → 3·3·3 instead of 4·4·1
  const k = Math.ceil(people.length / perRow), sizes = Array.from({length:k}, (_, i) => Math.floor(people.length / k) + (i < people.length % k ? 1 : 0));
  const groups = sizes.map(() => []);
  let rest = people;
  if (hasChild){
    const parent = parents[Math.floor(Math.random() * parents.length)];
    const fits = shuffled(sizes.map((n, i) => i).filter(i => sizes[i] >= 2));
    groups[fits[0]].push(CHILD, parent);
    rest = people.filter(n => n !== CHILD && n !== parent);
  }
  const pool = shuffled(rest);
  groups.forEach((g, i) => { while (g.length < sizes[i]) g.push(pool.pop()); });
  return { groups: shuffled(groups.map(shuffled)) };
}
function rideHTML(){
  const res = rideResult ? (rideResult.error ? `<p class="ride-msg">${esc(rideResult.error)}</p>`
    : `<div class="groups">${rideResult.groups.map((g, i) => `<div class="group" style="animation-delay:${i * .06}s"><span class="num">${i + 1}</span><div class="names">${g.map(n => `<span>${esc(n)}</span>`).join('')}</div></div>`).join('')}</div>`) : '';
  return `
  <section class="card"><h2><span class="ic c1">${icons.people}</span>Who's riding<span class="links"><button onclick="setRiders(true)">All</button><button onclick="setRiders(false)">None</button></span></h2>
    <div class="people">${roster.map(n => { const on = riders.includes(n); return `<label class="rider ${on ? '' : 'off'}"><input class="check" type="checkbox" ${on ? 'checked' : ''} onchange="toggleRider('${esc(n)}')">${esc(n)}</label>`; }).join('')}</div>
    <p class="note">${riders.length} of ${roster.length} riding · ${CHILD} always rides with ${PARENTS.join(' or ')}.</p></section>
  <section class="card"><label class="seat-row">Seats per row / vehicle
    <select onchange="setSeats(this.value)">${SEAT_OPTIONS.map(n => `<option ${n === seats ? 'selected' : ''}>${n}</option>`).join('')}</select></label></section>
  <button class="shuffle-btn" onclick="shuffleRiders()">${$('tab-ride').querySelector('svg').outerHTML}Shuffle</button>
  ${res}`;
}
function toggleRider(n){ riders = riders.includes(n) ? riders.filter(x => x !== n) : roster.filter(x => x === n || riders.includes(x)); store.set('orlando-riders', riders); rideResult = null; renderContent(); }
function setRiders(all){ riders = all ? roster.slice() : []; store.set('orlando-riders', riders); rideResult = null; renderContent(); }
function setSeats(v){ seats = +v; store.set('orlando-seats', seats); rideResult = null; renderContent(); }
function shuffleRiders(){ rideResult = makeGroups(riders, seats); renderContent(); document.querySelector('.shuffle-btn').scrollIntoView({behavior:'smooth', block:'start'}); }

/* ---------- actions ---------- */
function render(){ renderDays(); renderHero(); renderContent(); }
function setDay(i){ selected = i; tab = 'it'; query = ''; store.set('orlando-day', i); render(); window.scrollTo({top:0, behavior:'smooth'}); }
function setTab(t){ tab = t; render(); window.scrollTo({top:0, behavior:'smooth'}); }
function goToday(){ const t = todayIndex(); if (t >= 0) { setDay(t); setTimeout(() => { const n = document.querySelector('.is-next'); if (n) n.scrollIntoView({behavior:'smooth', block:'center'}); }, 350); } }
function toggle(i){ const k = selected+'-'+i; done[k] = !done[k]; store.set('orlando-done', done); renderContent(); }
function search(v){ query = v; $('list').innerHTML = listHTML(); }
function clearSearch(){ query = ''; renderContent(); }

/* theme toggle (auto → remembers choice) */
function applyTheme(t){ if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
  const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; $('themeBtn').innerHTML = dark ? icons.sun : icons.moon; }
$('themeBtn').onclick = () => { const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); const nt = cur === 'dark' ? 'light' : 'dark'; store.set('orlando-theme', nt); applyTheme(nt); };
applyTheme(store.get('orlando-theme', null));

const ti = todayIndex();
selected = ti >= 0 ? ti : Math.min(Math.max(+store.get('orlando-day', 0) || 0, 0), data.length - 1);
render();
let lastNext = nextIndex(selected);
setInterval(() => { const n = nextIndex(selected); if (tab === 'it' && !query && n !== lastNext) { lastNext = n; renderContent(); } }, 60000);
</script>
